<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Piano Room</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f2b84b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M18.5 8c-1.4 0-2.6-.8-3.2-2A6.87 6.87 0 0 0 2 9v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-8.5C22 9.6 20.4 8 18.5 8'/><path d='M2 14h20'/><path d='M6 14v4'/><path d='M10 14v4'/><path d='M14 14v4'/><path d='M18 14v4'/></svg>">
    <script type="module" src="/src/main.js"></script>
</head>
<body>
<main id="start">
    <form id="start-form">
        <h1><i data-lucide="piano"></i>Piano Room</h1>
        <input id="name" placeholder="Name" aria-label="Name" maxlength="24" autocomplete="nickname">
        <button id="go" type="submit" class="primary"></button>
    </form>
</main>

<div id="room" hidden>
    <header>
        <button id="invite" type="button" title="Copy the room link"><i data-lucide="link"></i><span>Invite</span></button>
        <span id="room-name" title="Room"></span>
        <ul id="people" aria-label="Players" aria-live="polite"></ul>
        <div id="loading" role="status" hidden><span id="loading-text"></span><div class="bar"><div id="loading-bar"></div></div></div>
        <div class="meters">
            <span class="meter" title="Last velocity">Velocity <b id="vel-last">–</b></span>
            <span class="meter" title="Keyboard velocity (Alt + key)"><i data-lucide="keyboard"></i><b id="vel-key"></b></span>
            <span class="transpose" role="group" aria-label="Transpose">
                <button type="button" data-transpose="-12" title="Down an octave (↓)" aria-label="Down an octave"><i data-lucide="chevrons-left"></i></button>
                <button type="button" data-transpose="-1" title="Down a semitone (←)" aria-label="Down a semitone"><i data-lucide="chevron-left"></i></button>
                <button type="button" id="transpose" title="Transpose (click to reset)" aria-label="Transpose 0, reset">0</button>
                <button type="button" data-transpose="1" title="Up a semitone (→)" aria-label="Up a semitone"><i data-lucide="chevron-right"></i></button>
                <button type="button" data-transpose="12" title="Up an octave (↑)" aria-label="Up an octave"><i data-lucide="chevrons-right"></i></button>
            </span>
            <span class="pedals" role="group" aria-label="Pedals">
                <span id="ped-sus" class="pedal" title="Sustain (Space)">Sustain</span>
                <button type="button" id="sus-invert" class="toggle" aria-pressed="false" title="Inverted sustain"><i data-lucide="arrow-down-up"></i>Invert</button>
                <span id="ped-sos" class="pedal" title="Sostenuto (])">Sostenuto</span>
                <span id="ped-soft" class="pedal">Soft</span>
            </span>
        </div>
        <button type="button" class="icon" popovertarget="settings" aria-label="Settings" title="Settings"><i data-lucide="settings"></i></button>
        <button id="fullscreen" type="button" class="icon" aria-label="Full screen" title="Full screen"><i data-lucide="maximize"></i></button>
    </header>

    <div id="settings" popover role="dialog" aria-labelledby="settings-title">
        <h2 id="settings-title">Settings</h2>
        <label>Name <input id="my-name" maxlength="24"></label>
        <label><span>Volume <output id="volume-val" for="volume"></output></span><input id="volume" type="range" min="0" max="100"></label>
        <label><span>Reverb <output id="reverb-val" for="reverb"></output></span><input id="reverb" type="range" min="0" max="127"></label>
        <label>Key labels <select id="labels"><option value="qwerty">QWERTY</option><option value="notes">Notes</option></select></label>
        <label>Piano <select id="piano">
            <option value="salamander-8">Salamander, 8 layers</option>
            <option value="salamander-16">Salamander, 16 layers</option>
            <option value="amethyst-studio">Amethyst Studio</option>
            <option value="amethyst-hall">Amethyst Hall</option>
        </select></label>
        <label>Style <select id="style">
            <option value="glow">Glow</option>
            <option value="pfa">PFA</option>
            <option value="flat">Flat</option>
        </select></label>
        <label><span>Brightness <output id="brightness-val" for="brightness"></output></span><input id="brightness" type="range" min="0" max="100"></label>
        <label>Note colors <select id="colors">
            <option value="player">Player</option>
            <option value="rainbow">Rainbow</option>
            <option value="custom">Custom</option>
        </select></label>
        <div id="custom-colors" class="swatches" hidden>
            <label><input id="white-color" type="color" value="#14e0b0"> White keys</label>
            <label><input id="black-color" type="color" value="#ff1a8c"> Black keys</label>
        </div>
        <fieldset>
            <legend>MIDI inputs</legend>
            <ul id="midi-list"></ul>
            <p id="midi-none" hidden>None</p>
        </fieldset>
        <p class="credit">Salamander Grand Piano by Alexander Holm, <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a>; SF2 by <a href="https://freepats.zenvoid.org/" target="_blank" rel="noopener">FreePats</a>.
            <a href="https://github.com/MyBlackMIDIScore/AmethystImperialGrand" target="_blank" rel="noopener">Amethyst Imperial Grand</a> by MBMS, samples <a href="https://creativecommons.org/licenses/by-nd/4.0/" target="_blank" rel="noopener">CC BY-ND 4.0</a>, unmodified and converted to SF3.</p>
    </div>

    <section id="stage" aria-hidden="true"><canvas id="rise"></canvas></section>
    <div id="keys" role="img" aria-label="Piano keyboard"></div>
</div>
</body>
</html>
